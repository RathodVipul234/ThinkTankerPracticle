{% extends 'base.html' %}

{% block content %}

<form method="POST" enctype="multipart/form-data">
 
    <!-- Security token -->
    {% csrf_token %}
 
    <!-- Using the formset -->
    <h1 class="text-center"> Login </h1>
    <div style="padding:0px 50px 0px 50px">
    	{{ form.as_p }}
	</div>
     
    <center>
    	<input type="submit" class="btn btn-primary text-center p-2" value="Login">
    </center>
</form>
{% endblock %}
